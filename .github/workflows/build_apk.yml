name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    env:
      GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://$GH_PAT@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Write client_secrets.json
        if: env.GOOGLE_CLIENT_SECRETS_JSON != ''
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ env.GOOGLE_CLIENT_SECRETS_JSON }}
          write-mode: overwrite

      - name: Create client_secrets.json placeholder
        if: env.GOOGLE_CLIENT_SECRETS_JSON == ''
        run: printf '{}\n' > app/src/main/assets/client_secrets.json

      - name: Clean CMake cache
        run: rm -rf app/.cxx chimahon/.cxx

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --no-daemon --no-parallel

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chimahon-debug-apks-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error